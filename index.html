<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No pinch-zoom: the wizard's sticky phone nav can be scaled off screen,
         and a zoomed page hides the step you are meant to answer. The header's
         text-size button (small / medium / large) is the way to make the type
         bigger instead — see src/app/text-size.ts. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <!-- The colour the browser tints its own chrome with (Safari's address
         bar, and the toolbar at the bottom of a phone): `--surface`, the bar
         the Next button sits in, so the two meet without a seam. These two
         follow the OS for the first paint only — `src/app/theme.ts` replaces
         them with one that follows the header's theme toggle. -->
    <meta
      name="theme-color"
      content="#303030"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="application-name" content="nQuake" />
    <meta
      name="description"
      content="nQuake web installer — set up a QuakeWorld client or server straight from your browser: ezQuake, MVDSV, KTX, maps, textures and sane defaults, downloaded into a folder you pick."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>nQuake — QuakeWorld installer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
