[package]
name = "nquake-reborn"
version = "0.0.0"
description = "nQuake web installer, in a window"
authors = ["nQuake"]
license = "GPL-2.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "nquake_reborn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
